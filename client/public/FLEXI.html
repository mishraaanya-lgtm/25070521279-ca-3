<style>
:root{font-family:'DM Sans',sans-serif;color:#29283a;background:#f7f7fb;font-synthesis:none;--ink:#29283a;--muted:#9291a3;--line:#ecebf2;--violet:#7165ed;--paper:#fff}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.layout{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:244px;background:white;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;gap:10px;font:800 22px Manrope,sans-serif;letter-spacing:-1px;margin:0 0 28px 6px}.brand-icon{width:35px;height:35px;border-radius:11px;background:linear-gradient(140deg,#9c8aff,#6859eb);color:white;display:grid;place-items:center}.brand small{display:block;color:#aaa8b8;font:700 8px 'DM Sans';letter-spacing:1.4px;margin-top:-3px}.workspace{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;align-items:center;gap:9px;margin-bottom:22px}.initials{height:33px;width:33px;border-radius:10px;background:#efedff;color:#7165ed;display:grid;place-items:center;font-size:11px;font-weight:700}.workspace b,.workspace small{display:block}.workspace b{font-size:11px}.workspace small{font-size:9px;color:var(--muted);margin-top:3px}.nav-label{font-size:9px;font-weight:700;letter-spacing:1.2px;color:#aaa8b7;margin:10px 10px 7px}.nav{display:grid;gap:4px}.nav button{height:39px;border:0;background:transparent;text-align:left;border-radius:8px;color:#77768a;display:flex;align-items:center;gap:10px;padding:0 11px;font-size:11px}.nav button:hover,.nav button.active{background:#f0eeff;color:#685be2;font-weight:700}.nav button span:first-child{width:17px;text-align:center}.side-bottom{margin-top:auto}.streak{background:#fff9f1;border:1px solid #f6ecdf;border-radius:9px;padding:11px;font-size:10px;margin-bottom:14px}.streak b{color:#db9445}.signout{border:0;border-top:1px solid var(--line);background:white;text-align:left;width:100%;padding:15px 3px 0;color:#77768a;font-size:10px}.main{margin-left:244px}.topbar{height:64px;background:#fffffff0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.crumb{font-size:10px;color:#a2a0af}.crumb b{color:#464457}.top-right{font-size:10px;color:#858394}.content{max-width:1360px;margin:auto;padding:32px 34px}.welcome,.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:23px}.kicker{font-size:9px;letter-spacing:1.2px;font-weight:700;color:#a19faf;margin:0 0 8px}.welcome h1,.page-head h1{font:700 27px Manrope,sans-serif;letter-spacing:-.8px;margin:0 0 6px}.welcome p:last-child,.page-head p:last-child{font-size:11px;color:#9291a3;margin:0}.primary{height:38px;border:0;border-radius:8px;background:#7165ed;color:white;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:10px;font-weight:700;box-shadow:0 5px 14px #7165ed2b}.primary:hover{background:#6053dd}.primary:disabled{opacity:.5;cursor:wait}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.metric,.panel{border:1px solid var(--line);background:white;border-radius:10px}.metric{padding:14px 15px}.metric-top{display:flex;align-items:center;justify-content:space-between;color:#89889a;font-size:10px}.badge-icon{height:28px;width:28px;border-radius:9px;background:#f0eeff;color:#786bea;display:grid;place-items:center}.metric strong{display:block;font:700 22px Manrope,sans-serif;margin-top:8px}.metric small{font-size:9px;color:#aaa8b5}.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{padding:16px;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel-head h2{font:700 14px Manrope,sans-serif;margin:0}.link{border:0;background:transparent;color:#7267e7;font-size:9px;font-weight:700}.subject{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #f2f1f6}.subject:last-child{border-bottom:0}.subject-icon{width:34px;height:34px;border-radius:9px;background:#eeeaff;color:#7467ea;display:grid;place-items:center}.subject-body{flex:1;min-width:0}.subject-line{display:flex;justify-content:space-between;font-size:10px;margin-bottom:6px}.subject-line span{color:#756be4}.track{height:5px;border-radius:8px;background:#f0eff5;overflow:hidden}.track i{height:100%;display:block;background:#8175f0;border-radius:8px}.subject-body small{display:block;font-size:8px;color:#a5a3b1;margin-top:5px}.empty{text-align:center;padding:28px 10px;color:#9997a8;font-size:10px}.empty b{display:block;color:#565468;margin-bottom:5px}.tasks{display:flex;align-items:center;gap:11px;border-bottom:1px solid #f2f1f6;padding:12px 2px}.tasks:last-child{border:0}.task-date{width:42px;height:42px;border-radius:8px;background:#f2f0ff;color:#7669e9;display:grid;place-content:center;text-align:center;font-size:9px}.task-date small{font-size:8px}.task-title{flex:1}.task-title b,.task-title small{display:block}.task-title b{font-size:10px}.task-title small{font-size:8px;color:#a2a0ae;margin-top:4px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.cards .panel{margin:0}.topic{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f2f1f6;font-size:9px}.topic:last-child{border:0}.topic select{border:1px solid var(--line);border-radius:5px;padding:4px;font-size:8px;background:white;color:#777}.goal-row{padding:12px 0;border-bottom:1px solid #f2f1f6}.goal-row b{font-size:10px}.goal-row small{display:block;color:#a2a0ae;font-size:8px;margin:5px 0 8px}.plan-row{display:flex;gap:12px;align-items:center;border-bottom:1px solid #f2f1f6;padding:12px 0}.plan-row:last-child{border:0}.plan-date{width:44px;text-align:center;color:#7569e8;font-size:9px}.plan-info{flex:1}.plan-info b,.plan-info small{display:block}.plan-info b{font-size:10px}.plan-info small{font-size:8px;color:#9997a6;margin-top:4px}.risk{font-size:9px;color:#bf8a44;background:#fff8ed;border-radius:6px;padding:8px}.focus-box{max-width:660px;text-align:center;margin:0 auto;padding:28px}.clock{width:200px;height:200px;border-radius:50%;border:10px solid #f0eff7;box-shadow:inset 0 0 0 2px #8276ee;display:grid;place-content:center;margin:22px auto}.clock b{font:700 43px Manrope}.clock small{font-size:8px;letter-spacing:1px;color:#aaa}.focus-actions{display:flex;justify-content:center;gap:8px;margin-top:15px}.secondary{height:38px;border:1px solid var(--line);background:white;border-radius:8px;padding:0 12px;color:#777;font-size:10px}.toast,.error{border-radius:8px;padding:10px 13px;font-size:10px;margin-bottom:12px}.toast{background:#eff8f4;color:#498d76}.error{background:#fff2f0;color:#b85648}.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:white}.auth-side{background:#f0edff;padding:35px;display:flex;flex-direction:column}.auth-copy{margin:auto 0}.auth-copy h1{font:700 clamp(38px,5vw,58px)/1.1 Manrope;color:#373256;letter-spacing:-2px}.auth-copy h1 em{color:#7468ed;font-style:normal}.auth-copy p{font-size:12px;line-height:1.7;color:#86829f;max-width:350px}.auth-form{width:min(360px,calc(100% - 40px));margin:auto;align-self:center}.auth-form h2{font:700 24px Manrope;margin:8px 0}.auth-form>p{font-size:10px;color:#9896a5;margin-bottom:22px}.field{display:block;font-size:10px;font-weight:600;margin:13px 0}.field input,.field select{display:block;margin-top:6px;width:100%;height:40px;border:1px solid #e8e7ef;border-radius:7px;padding:0 10px;outline:0;font-size:10px}.field input:focus,.field select:focus{border-color:#a59af5;box-shadow:0 0 0 3px #7165ed18}.auth-form .primary{width:100%;margin-top:8px}.switch{font-size:10px;text-align:center;color:#9291a3;margin-top:19px}.switch button{border:0;background:none;color:#7165ed;font-weight:700}.modal-back{position:fixed;inset:0;background:#26233d66;z-index:8;display:grid;place-items:center;padding:18px}.modal{background:white;width:min(460px,100%);max-height:90vh;overflow:auto;border-radius:12px;padding:20px;box-shadow:0 18px 60px #24213d2e}.modal h2{font:700 16px Manrope;margin:0 0 16px}.form-grid{display:grid;gap:11px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .primary{width:100%;margin-top:4px}.mobile-menu{display:none}
@media(max-width:950px){.side{width:210px}.main{margin-left:210px}.content{padding:25px 20px}.topbar{padding:0 20px}.metrics{gap:8px}.columns{grid-template-columns:1fr}}
@media(max-width:680px){.side{display:none}.main{margin:0}.topbar{height:56px;padding:0 15px}.content{padding:22px 14px}.welcome,.page-head{align-items:flex-start;flex-direction:column}.welcome h1,.page-head h1{font-size:23px}.welcome .primary,.page-head .primary{width:100%}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{padding:12px}.metric strong{font-size:19px}.cards{grid-template-columns:1fr}.auth{grid-template-columns:1fr}.auth-side{min-height:225px;padding:24px}.auth-copy h1{font-size:34px;margin:15px 0 8px}.auth-copy p{margin:0;font-size:10px}.auth-form{padding:30px 0}.clock{width:180px;height:180px}.focus-actions{flex-direction:column}.focus-actions>*{width:100%}}

<body><div id="flexi-root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel" data-presets="env,react">
const {useEffect,useMemo,useState}=React;
const API=window.FLEXI_API_URL||'http://localhost:4000/api';
const req=async(path,options={})=>{const token=localStorage.getItem('flexi_token');const response=await fetch(API+path,{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(token?{Authorization:`Bearer ${token}`}:{})}});const data=await response.json().catch(()=>({message:'Server unavailable'}));if(!response.ok)throw Error(data.message||'Request failed');return data};
const initials=(name='Student')=>name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
function App(){
 const [user,setUser]=useState(null),[subjects,setSubjects]=useState([]),[analytics,setAnalytics]=useState(null),[plan,setPlan]=useState(null),[page,setPage]=useState('Overview'),[mode,setMode]=useState('login'),[error,setError]=useState(''),[notice,setNotice]=useState(''),[busy,setBusy]=useState(false),[modal,setModal]=useState(''),[seconds,setSeconds]=useState(25*60),[running,setRunning]=useState(false),[minutes,setMinutes]=useState(25);
 const refresh=async()=>{const [s,a,p]=await Promise.all([req('/subjects'),req('/analytics'),req('/plans/current')]);setSubjects(s.subjects||[]);setAnalytics(a.analytics);setPlan(p.plan);};
 useEffect(()=>{if(localStorage.getItem('flexi_token')){refresh().then(()=>req('/me')).then(x=>setUser(x.user)).catch(e=>{localStorage.removeItem('flexi_token');setError(e.message)})}},[]);
 useEffect(()=>{if(!running)return;const t=setInterval(()=>setSeconds(s=>{if(s<=1){setRunning(false);return 0}return s-1}),1000);return()=>clearInterval(t)},[running]);
 const totalMinutes=analytics?.focusMinutes||0,topics=subjects.flatMap(s=>s.topics||[]),progress=topics.length?Math.round(topics.reduce((n,t)=>n+(t.progress||0),0)/topics.length):0;
 async function auth(e){e.preventDefault();setBusy(true);setError('');const f=new FormData(e.currentTarget);try{const path=mode==='signup'?'/auth/signup':'/auth/login';const payload=mode==='signup'?{name:f.get('name'),email:f.get('email'),password:f.get('password')}:{email:f.get('email'),password:f.get('password')};const data=await req(path,{method:'POST',body:JSON.stringify(payload)});localStorage.setItem('flexi_token',data.token);setUser(data.user);await refresh()}catch(err){setError(err.message)}finally{setBusy(false)}}
 function logout(){localStorage.removeItem('flexi_token');setUser(null);setSubjects([]);setAnalytics(null);setPlan(null)}
 async function addSubject(e){e.preventDefault();const f=new FormData(e.currentTarget);try{await req('/subjects',{method:'POST',body:JSON.stringify({name:f.get('name'),examDate:f.get('examDate'),difficulty:Number(f.get('difficulty')),availableHoursPerWeek:Number(f.get('hours')),color:'#7165ed',topics:f.get('topics').split(',').map(x=>x.trim()).filter(Boolean).map(name=>({name,difficulty:5,strength:'medium',progress:0,estimatedHours:1}))})});setModal('');setNotice('Subject added to your workspace');await refresh()}catch(err){setError(err.message)}}
 async function addGoal(e){e.preventDefault();const f=new FormData(e.currentTarget);try{await req('/goals',{method:'POST',body:JSON.stringify({title:f.get('title'),type:f.get('type'),targetHours:Number(f.get('hours')),targetDate:f.get('date')})});setModal('');setNotice('Goal saved');await refresh()}catch(err){setError(err.message)}}
 async function generate(){if(!subjects.length){setModal('subject');return}setBusy(true);try{const result=await req('/plans/generate',{method:'POST',body:JSON.stringify({availableHoursPerDay:3,startDate:new Date().toISOString(),endDate:new Date(Date.now()+7*86400000).toISOString(),preferredSessionMinutes:50,goals:['Prioritize upcoming exams','Review weak topics']})});setPlan(result.plan);setPage('Study plan');setNotice('Your study plan is ready')}catch(err){setError(err.message)}finally{setBusy(false)}}
 async function saveSession(){try{await req('/focus-sessions',{method:'POST',body:JSON.stringify({durationMinutes:Math.max(1,Math.round((minutes*60-seconds)/60)),mode:'study',completed:true})});setNotice('Focus session saved');await refresh()}catch(err){setError(err.message)}}
 async function topicProgress(subject,topic,value){try{await req(`/subjects/${subject._id}/topics/${topic._id}`,{method:'PATCH',body:JSON.stringify({progress:Number(value),strength:value>=80?'strong':value<30?'weak':'medium'})});await refresh()}catch(err){setError(err.message)}}
 if(!user)return <main className="auth"><section className="auth-side"><div className="brand"><span className="brand-icon">✳</span><span>flexi.<small>STUDY SPACE</small></span></div><div className="auth-copy"><p className="kicker">YOUR SPACE TO GROW</p><h1>Make space for<br/><em>what matters.</em></h1><p>Plan with purpose. Find your focus. Feel good about how far you’ve come.</p></div><small className="top-right">A little more clarity, every day.</small></section><section className="auth-form"><p className="kicker">WELCOME {mode==='login'?'BACK':'ABOARD'}</p><h2>{mode==='login'?'Let’s get back to it.':'Create your space.'}</h2><p>Sign in to pick up where you left off.</p>{error&&<div className="error">{error}</div>}<form onSubmit={auth}>{mode==='signup'&&<label className="field">Your name<input name="name" required minLength="2" placeholder="Alex Morgan"/></label>}<label className="field">Email address<input name="email" type="email" required placeholder="you@example.com"/></label><label className="field">Password<input name="password" type="password" required minLength={mode==='signup'?8:1} placeholder="At least 8 characters"/></label><button className="primary" disabled={busy}>{busy?'One moment…':mode==='login'?'Sign in':'Create account'}　↗</button></form><div className="switch">{mode==='login'?'New to FLEXI?':'Already have an account?'} <button onClick={()=>{setError('');setMode(mode==='login'?'signup':'login')}}>{mode==='login'?'Create an account':'Sign in'}</button></div></section></main>;
 const nav=['Overview','My subjects','Study plan','Goals','Focus timer','Progress'];
 return <div className="layout"><aside className="side"><div className="brand"><span className="brand-icon">✳</span><span>flexi.<small>STUDY SPACE</small></span></div><div className="workspace"><span className="initials">{initials(user.name)}</span><div><b>{user.name.split(' ')[0]}'s space</b><small>Personal workspace</small></div></div><p className="nav-label">WORKSPACE</p><nav className="nav">{nav.map((item,i)=><button key={item} className={page===item?'active':''} onClick={()=>setPage(item)}><span>{['◫','▤','▦','◎','◷','↗'][i]}</span>{item}</button>)}</nav><div className="side-bottom"><div className="streak">🔥　<b>{analytics?.streak||0} day streak</b><br/><small>Keep your momentum going</small></div><button className="signout" onClick={logout}>↪　{user.name} · Sign out</button></div></aside>
 <main className="main"><header className="topbar"><span className="crumb">My workspace　/　<b>{page}</b></span><span className="top-right">{new Date().toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'})}　 ◉ {initials(user.name)}</span></header><div className="content">{error&&<div className="error">{error}<button className="link" onClick={()=>setError('')}>Dismiss</button></div>}{notice&&<div className="toast">✓　{notice}<button className="link" onClick={()=>setNotice('')}>Close</button></div>}
 {page==='Overview'&&<><section className="welcome"><div><p className="kicker">YOUR STUDY SPACE</p><h1>Good {new Date().getHours()<12?'morning':new Date().getHours()<18?'afternoon':'evening'}, {user.name.split(' ')[0]} ✳</h1><p>A little progress today goes a long way. Here’s your week at a glance.</p></div><button className="primary" onClick={generate} disabled={busy}>✧　{busy?'Building plan…':'Generate study plan'}</button></section><section className="metrics">{[['Active subjects',subjects.length,`${topics.length} topics`,'▤'],['Study time',`${Math.floor(totalMinutes/60)}h ${totalMinutes%60}m`,'Recent focus sessions','◷'],['Average progress',`${progress}%`,'Across your topics','◎'],['Backlog risk',`${analytics?.backlogRisk||0}%`,'Keep a steady pace','⌁']].map(([label,value,note,icon])=><article className="metric" key={label}><div className="metric-top">{label}<span className="badge-icon">{icon}</span></div><strong>{value}</strong><small>{note}</small></article>)}</section><section className="columns"><article className="panel"><div className="panel-head"><div><p className="kicker">IN YOUR LIBRARY</p><h2>Your subjects</h2></div><button className="link" onClick={()=>setPage('My subjects')}>View all →</button></div>{subjects.length?subjects.slice(0,5).map(s=><SubjectRow key={s._id} subject={s}/>):<Empty title="Your library starts here" text="Add your first subject to organize topics and exam dates." action="Add a subject" click={()=>setModal('subject')}/>}</article><article className="panel"><div className="panel-head"><div><p className="kicker">UP NEXT</p><h2>Study schedule</h2></div><button className="link" onClick={()=>setPage('Study plan')}>Full plan →</button></div>{plan?.items?.length?plan.items.slice(0,5).map((it,i)=><div className="tasks" key={it._id||i}><div className="task-date">{new Date(it.startsAt).toLocaleDateString('en',{weekday:'short'})}<small>{new Date(it.startsAt).toLocaleDateString('en',{month:'short',day:'numeric'})}</small></div><div className="task-title"><b>{it.topic}</b><small>{it.subject} · {new Date(it.startsAt).toLocaleTimeString('en',{hour:'numeric',minute:'2-digit'})}</small></div></div>):<Empty title="A plan that fits you" text="Generate a weekly plan around your upcoming exams." action="Build my plan" click={generate}/>}</article></section></>}
 {page==='My subjects'&&<><PageHead eyebrow="YOUR LIBRARY" title="My subjects" text="Keep your subjects, topics, and exam progress in one place." action={()=>setModal('subject')}/>{subjects.length?<section className="cards">{subjects.map(s=><article className="panel" key={s._id}><div className="panel-head"><h2>{s.name}</h2><span className="top-right">Exam {new Date(s.examDate).toLocaleDateString('en',{month:'short',day:'numeric'})}</span></div><p className="kicker">{s.topics?.length||0} TOPICS　·　{s.availableHoursPerWeek} HRS/WEEK</p>{(s.topics||[]).map(t=><div className="topic" key={t._id}><span>{t.name}</span><select value={t.progress||0} onChange={e=>topicProgress(s,t,e.target.value)}><option value="0">0%</option><option value="25">25%</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option></select></div>)}</article>)}</section>:<article className="panel"><Empty title="No subjects yet" text="Add a subject and start building your study library." action="Add a subject" click={()=>setModal('subject')}/></article>}</>}
 {page==='Study plan'&&<><PageHead eyebrow="YOUR WEEK, WITH A LITTLE MORE CLARITY" title="Study plan" text="A balanced plan based on your subjects and priorities." action={generate} label={plan?"Regenerate plan":"Generate plan"}/>{plan?<><article className="panel"><div className="panel-head"><div><p className="kicker">PERSONALIZED PLAN</p><h2>{plan.title}</h2></div><span className="risk">Backlog risk　{plan.backlogRisk||0}%</span></div><p className="top-right">{plan.summary}</p></article><article className="panel">{plan.items?.length?plan.items.map((it,i)=><div className="plan-row" key={it._id||i}><div className="plan-date"><b>{new Date(it.startsAt).toLocaleDateString('en',{weekday:'short'})}</b><small>{new Date(it.startsAt).toLocaleDateString('en',{month:'short',day:'numeric'})}</small></div><div className="plan-info"><b>{it.topic}</b><small>{it.subject} · {it.mode}</small></div><span className="top-right">{new Date(it.startsAt).toLocaleTimeString('en',{hour:'numeric',minute:'2-digit'})}</span></div>):<Empty title="No sessions in this plan" text="Add topics and try generating a plan again."/>}</article></>:<article className="panel"><Empty title="Your week, made a little easier" text="Add subjects and topics, then generate your personalized plan." action="Generate my plan" click={generate}/></article>}</>}
 {page==='Goals'&&<><PageHead eyebrow="SMALL STEPS, REAL MOMENTUM" title="Goals & intentions" text="Choose something achievable and build steady progress." action={()=>setModal('goal')} label="Set a goal"/>{analytics?.goals?.length?<div className="cards">{analytics.goals.map(g=><article className="panel" key={g._id}><p className="kicker">{g.type.toUpperCase()} GOAL</p><h2>{g.title}</h2><p className="top-right">{g.targetHours||0} study hours · Due {new Date(g.targetDate).toLocaleDateString('en',{month:'short',day:'numeric'})}</p></article>)}</div>:<article className="panel"><Empty title="Start with one small goal" text="A clear intention can make it easier to show up." action="Create a goal" click={()=>setModal('goal')}/></article>}</>}
 {page==='Focus timer'&&<><PageHead eyebrow="A MOMENT FOR YOURSELF" title="Focus timer" text="One thing at a time. Give your attention a place to land."/><article className="panel focus-box"><p className="kicker">{running?'SESSION IN PROGRESS':'READY WHEN YOU ARE'}</p><div className="clock"><div><b>{String(Math.floor(seconds/60)).padStart(2,'0')}:{String(seconds%60).padStart(2,'0')}</b><small>MINUTES LEFT</small></div></div><div className="focus-actions">{[25,45,50].map(n=><button className="secondary" key={n} onClick={()=>{setRunning(false);setMinutes(n);setSeconds(n*60)}}>{n} min</button>)}</div><div className="focus-actions"><button className="primary" onClick={()=>{if(seconds===0)setSeconds(minutes*60);setRunning(!running)}}>{running?'Pause':'Start focusing'}</button><button className="secondary" onClick={saveSession}>✓ Save session</button></div></article></>}
 {page==='Progress'&&<><PageHead eyebrow="NOTICE YOUR PROGRESS" title="Your progress" text="Every session counts. Look how far you’ve come."/><section className="metrics">{[['Focused time',`${Math.floor(totalMinutes/60)}h ${totalMinutes%60}m`,'Study minutes'],['Topics tracked',topics.length,'Across your library'],['Focus sessions',analytics?.sessions?.filter(s=>s.completed).length||0,'Completed sessions'],['Current streak',`${analytics?.streak||0} days`,'Keep showing up']].map(([a,b,c])=><article className="metric" key={a}><div className="metric-top">{a}</div><strong>{b}</strong><small>{c}</small></article>)}</section><section className="columns"><article className="panel"><div className="panel-head"><h2>Topics needing attention</h2></div>{analytics?.weakTopics?.length?analytics.weakTopics.map(t=><div className="topic" key={t.name}><span>{t.name}</span><small>Needs review</small></div>):<Empty title="You're in a good place" text="Topics that need attention will appear here."/>}</article><article className="panel"><div className="panel-head"><h2>Subject progress</h2></div>{subjects.map(s=><SubjectRow key={s._id} subject={s}/>)}</article></section></>}
 </div></main>{modal&&<div className="modal-back" onMouseDown={e=>{if(e.target===e.currentTarget)setModal('')}}><section className="modal"><div className="panel-head"><h2>{modal==='subject'?'Add a subject':'Set a study goal'}</h2><button className="link" onClick={()=>setModal('')}>Close</button></div>{modal==='subject'?<form className="form-grid" onSubmit={addSubject}><label className="field">Subject name<input name="name" required minLength="2" placeholder="Applied Mathematics"/></label><div className="form-row"><label className="field">Exam date<input name="examDate" type="date" required/></label><label className="field">Difficulty<input name="difficulty" type="number" min="1" max="10" defaultValue="5" required/></label></div><div className="form-row"><label className="field">Hours each week<input name="hours" type="number" min="1" defaultValue="5" required/></label><label className="field">Topics (comma separated)<input name="topics" required placeholder="Vectors, Integration"/></label></div><button className="primary">Add subject</button></form>:<form className="form-grid" onSubmit={addGoal}><label className="field">Goal<input name="title" required placeholder="Complete two chapters"/></label><div className="form-row"><label className="field">Frequency<select name="type"><option value="weekly">Weekly</option><option value="daily">Daily</option></select></label><label className="field">Target hours<input name="hours" type="number" min="1" defaultValue="5" required/></label></div><label className="field">Due date<input name="date" type="date" required/></label><button className="primary">Save goal</button></form>}</section></div>}</div>
}
function SubjectRow({subject}){const ts=subject.topics||[],p=ts.length?Math.round(ts.reduce((n,t)=>n+(t.progress||0),0)/ts.length):0;return <div className="subject"><span className="subject-icon">▤</span><div className="subject-body"><div className="subject-line"><b>{subject.name}</b><span>{p}%</span></div><div className="track"><i style={{width:`${p}%`}}/></div><small>{ts.length} topics · Exam {new Date(subject.examDate).toLocaleDateString('en',{month:'short',day:'numeric'})}</small></div></div>}
function PageHead({eyebrow,title,text,action,label="Generate plan"}){return <section className="page-head"><div><p className="kicker">{eyebrow}</p><h1>{title}</h1><p>{text}</p></div>{action&&<button className="primary" onClick={action}>＋　{label}</button>}</section>}
function Empty({title,text,action,click}){return <div className="empty"><b>{title}</b>{text}{action&&<p><button className="link" onClick={click}>{action} →</button></p>}</div>}
ReactDOM.createRoot(document.getElementById('flexi-root')).render(<App/>);
</script></body></html>
